name: viem_dart_builders
description: >-
  build_runner code generator for viem_dart: turns a @GenerateAbi-annotated
  part directive + an ABI JSON file into typed <Name>Contract /
  <Name>WalletContract classes (typed read/write methods, typed events,
  freezed classes for Solidity tuples/structs).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  analyzer: ^13.3.0
  build: ^4.0.10
  code_builder: ^4.11.1
  dart_style: ^3.1.12
  path: ^1.9.1
  source_gen: ^4.2.4
  viem_dart: ^0.2.0

dev_dependencies:
  build_runner: ^2.16.0
  build_test: ^3.5.19
  lints: ^6.0.0
  logging: ^1.3.0
  test: ^1.31.2
  viem_dart_test_harness: ^0.0.1
