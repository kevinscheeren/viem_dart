name: cli_example
description: >-
  A pure-Dart CLI demoing viem_dart: reading an ETH balance, making an
  eth_call, batching reads via Multicall3, watching new blocks, and calling
  a viem_dart_builders-generated typed contract — all over a plain HTTP
  transport.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  viem_dart: ^0.1.0

dev_dependencies:
  build_runner: ^2.16.0
  lints: ^6.0.0
  viem_dart_builders: ^0.0.1
